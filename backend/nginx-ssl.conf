# ImGuiOverlay v3.0 — HTTPS 手动配置模板 (腾讯云免费 SSL)
# 使用步骤:
# 1. 前往 https://console.cloud.tencent.com/ssl 申请免费证书
# 2. 下载 Nginx 格式证书 → 得到 .crt 和 .key 两个文件
# 3. 上传到服务器: scp *.crt *.key root@你的IP:/etc/nginx/ssl/
# 4. 使用此配置替换 /etc/nginx/sites-available/overlay

server {
    listen 80;
    server_name your-domain.com;         # ← 改成你的域名
    return 301 https://$host$request_uri; # HTTP 自动跳转 HTTPS
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;         # ← 改成你的域名

    # ── SSL 证书路径 ──
    ssl_certificate     /etc/nginx/ssl/your-domain.com_bundle.crt;  # ← 改成实际路径
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;         # ← 改成实际路径

    # ── SSL 安全配置 ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── 日志 ──
    access_log /var/log/nginx/overlay-access.log;
    error_log  /var/log/nginx/overlay-error.log;
    client_max_body_size 10m;

    # ── 反向代理到 Python 服务 ──
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

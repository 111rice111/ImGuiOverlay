# ImGuiOverlay v3.0 — 宝塔面板 Nginx 反向代理配置
# =============================================
# 适用: 腾讯云轻量应用服务器 Windows + 宝塔面板
#
# 配置步骤:
# 1. 登录宝塔面板 → 网站 → 添加站点 (域名或IP)
# 2. 站点设置 → 反向代理 → 添加反向代理
#   - 目标URL: http://127.0.0.1:8080
#   - 发送域名: $host
# 3. 或者直接修改 Nginx 配置文件 (如下)
# =============================================

server {
    listen 80;
    server_name 43.136.183.71;          # ← 你的服务器 IP 或域名

    # 日志
    access_log  D:/BtSoft/wwwlogs/overlay_access.log;
    error_log   D:/BtSoft/wwwlogs/overlay_error.log;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端请求大小限制
    client_max_body_size 10m;

    # ── 反向代理到 Python 服务 (端口 8080) ──
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # API 路径 — 更长超时
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }
}


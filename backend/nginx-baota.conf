# ============================================================
# 宝塔面板操作步骤详解:
# ============================================================
#
# 方式一: 图形界面 (最简单)
# ---------------------------
# 1. 登录宝塔面板: http://43.136.183.71:8888
#    默认用户名: admin, 密码: 首次登录时设置的
#
# 2. 左侧菜单 → "网站" → "添加站点"
#    - 域名: 填 43.136.183.71 (或你的域名)
#    - 根目录: 自动生成即可
#    - PHP版本: 选"纯静态"
#    - 点击提交
#
# 3. 点击刚创建的站点 → "设置"
#    - 找到 "反向代理" 标签
#    - 点击 "添加反向代理"
#    - 代理名称: overlay-api
#    - 目标URL: http://127.0.0.1:8080
#    - 发送域名: $host (保持默认)
#    - 点击提交
#
# 4. (可选) SSL证书:
#    - 站点设置 → "SSL" → "Let's Encrypt" (如果有域名)
#    - 或 "其他证书" 上传腾讯云免费SSL
#
# 方式二: 直接编辑配置文件
# ---------------------------
# 1. 宝塔面板 → "软件商店" → Nginx → 设置 → "配置修改"
#    将上方 server {} 块追加到 http {} 内
# 2. 或者在 "网站" 中添加站点后直接替换其配置
#
# ============================================================
